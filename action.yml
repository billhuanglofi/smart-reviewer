name: 'Smart Reviewer'
description: 'AI-powered PR review, description, and improvement suggestions'
inputs:
  github_token:
    description: 'GitHub token'
    required: true
    default: '${{ github.token }}'
  openai_api_key:
    description: 'OpenAI API key'
    required: true
  model:
    description: 'LLM model to use'
    required: false
    default: 'gpt-4o'
  auto_review:
    description: 'Enable auto review'
    required: false
    default: 'true'
  auto_describe:
    description: 'Enable auto describe'
    required: false
    default: 'true'
  auto_improve:
    description: 'Enable auto improve'
    required: false
    default: 'true'
  extra_instructions:
    description: 'Extra instructions for AI'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    GITHUB_TOKEN: '${{ inputs.github_token }}'
    OPENAI_API_KEY: '${{ inputs.openai_api_key }}'
    LLM_MODEL: '${{ inputs.model }}'
    AUTO_REVIEW: '${{ inputs.auto_review }}'
    AUTO_DESCRIBE: '${{ inputs.auto_describe }}'
    AUTO_IMPROVE: '${{ inputs.auto_improve }}'
    EXTRA_INSTRUCTIONS: '${{ inputs.extra_instructions }}'
